name: mvp-ci

on:
  pull_request:
    paths:
      - '**.html'
      - '**.js'
      - '**.mjs'
      - '**.json'
      - '**.css'
      - 'package*.json'
      - '.github/workflows/mvp-ci.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          AI_ENABLED: 'false'
          DB_PATH: './server/data/ci.sqlite'
