<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>产品路线图｜时空剧场</title><link rel="stylesheet" href="admin.css"></head><body data-page="roadmap"><div class="admin-shell"><aside class="admin-sidebar"><a class="tt-brand" href="index.html"><span class="tt-brand-mark">管</span><span><strong>管理后台</strong><span>愿望驱动路线图</span></span></a><nav class="admin-menu"><a data-page="dashboard" href="index.html">总览</a><a data-page="interactions" href="interactions.html">用户互动</a><a data-page="feedback" href="feedback.html">用户反馈</a><a data-page="wishes" href="wishes.html">许愿池治理</a><a class="active" data-page="roadmap" href="roadmap.html">产品路线图</a><a data-page="audit" href="audit.html">操作审计</a><a href="../ai-mvp.html">返回产品</a></nav></aside><main class="admin-main"><header class="admin-topbar"><div><div class="tt-kicker">PRODUCT ROADMAP</div><h1>产品路线图</h1><p class="tt-muted">路线图直接读取愿望状态，不维护第二份手工清单。</p></div><div><span id="adminEmail" class="tt-muted"></span> <button id="logoutButton" class="tt-btn ghost">退出</button></div></header><div id="pageError" class="tt-alert" hidden></div><section id="roadmapGrid" class="tt-grid four"></section></main></div><script src="../assets/js/api-client.js"></script><script>(async function(){function e(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}try{var me=await TTApi.get('/admin/auth/me');document.getElementById('adminEmail').textContent=me.admin.email;document.getElementById('logoutButton').onclick=async function(){await TTApi.post('/admin/auth/logout',{});location.replace('login.html')};var columns=[['researching','调研中'],['planned','已计划'],['developing','开发中'],['implemented','已实现']];var grid=document.getElementById('roadmapGrid');for(var pair of columns){var response=await TTApi.get('/admin/wishes?status='+pair[0]+'&limit=100');var section=document.createElement('section');section.className='tt-card';section.innerHTML='<div class="tt-section-title"><h2>'+pair[1]+'</h2><span class="tt-chip">'+(response.items||[]).length+'</span></div>'+((response.items||[]).map(function(item){return '<article style="padding:12px 0;border-top:1px solid var(--line)"><strong>'+e(item.title)+'</strong><p class="tt-muted">✦ '+Number(item.voteCount||0)+' · '+e(item.priority||'未定优先级')+' · '+e(item.targetVersion||'未定版本')+'</p></article>'}).join('')||'<p class="tt-muted">暂无内容</p>');grid.appendChild(section)}}catch(error){document.getElementById('pageError').hidden=false;document.getElementById('pageError').textContent=error.message||'加载失败';if(error.status===401)location.replace('login.html')}})();</script></body></html>
