# ============================================================
# 时空剧场 time-theater — Nginx 反代片段 (配置即代码 / config-as-code)
# ============================================================
#
# 部署事实（2026-08-04 实测，生产已验证通过）：
#   - 时空剧场是「全栈 Node 服务端」，不是静态目录。
#     旧版模板里 `root /www/wwwroot/awkn-lab/game/current` + 只反代 `/api/`
#     的写法已过时，会导致首页 404、AI 导学/事件上报全挂。
#   - 真实架构：Nginx 反代 `/game/` → 127.0.0.1:8787（Node 内置 http + node:sqlite）。
#   - 这些 location 块属于共享 vhost `awkn.cn.conf` 的 `server { }` 内部，
#     不要当成独立 server 块使用（否则会与主 vhost 的 server_name 冲突）。
#
# 用法：把下面的 location 块整体粘进 `/etc/nginx/conf.d/awkn.cn.conf`
#      的 `server { ... }` 内，与 `/win/`、`/life/` 等兄弟站点并列。
#      粘完后 `nginx -t && systemctl reload nginx`。
# ============================================================

    # === 时空剧场 time-theater 全栈 Node 服务端，反代到 127.0.0.1:8787 ===
    # 末尾 / 不可省：把 /game/foo 映射到后端 /foo
    location = /game {
        return 301 /game/;
    }

    location ^~ /game/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # === 安全护栏：禁止直接访问服务端敏感路径（即使反代也可能被 location 命中）===
    # 旧版静态模板的 deny 规则仍适用，保留以防后端暴露 .env / 数据库
    location ~* ^/game/(server/data|\.env) {
        deny all;
    }
