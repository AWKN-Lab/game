<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>首页编辑器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #eee; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; display: flex; }

  #preview-panel { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
  #phone-frame {
    width: 390px; height: 844px; border: 3px solid #555; border-radius: 30px; overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.6); position: relative; background: #000; z-index: 0;
  }
  #phone-frame iframe { border: none; width: 100%; height: 100%; }

  #props-panel {
    width: 340px; background: #1a1a2e; border-left: 2px solid #333; padding: 16px;
    overflow-y: auto; font-size: 13px;
  }
  #props-panel h2 { color: #efbd8a; margin-bottom: 12px; font-size: 16px; }
  .prop-group { margin-bottom: 16px; background: #0d1a3c; border-radius: 8px; padding: 12px; border: 1px solid #283356; }
  .prop-group h3 { color: #b6c4ff; font-size: 12px; margin-bottom: 8px; letter-spacing: 1px; }
  .prop-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .prop-row label { color: #888; width: 60px; font-size: 11px; flex-shrink: 0; }
  .prop-row input {
    flex: 1; background: #041133; border: 1px solid #444; color: #eee; padding: 4px 8px;
    border-radius: 4px; font-size: 12px; font-family: monospace;
  }
  .prop-row input:focus { border-color: #efbd8a; outline: none; }
  .prop-row .unit { color: #666; font-size: 10px; width: 24px; }
  .prop-row button {
    background: #ff6b35; color: white; border: none; padding: 3px 10px; border-radius: 3px;
    cursor: pointer; font-size: 11px; font-family: monospace;
  }
  .prop-row button:hover { background: #ff8c5a; }

  #toolbar {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 100;
    background: rgba(26,26,46,0.95); border: 1px solid #444; border-radius: 8px;
    padding: 6px 12px; display: flex; gap: 8px; align-items: center;
  }
  #toolbar button {
    background: #ff6b35; color: white; border: none; padding: 6px 12px; border-radius: 4px;
    cursor: pointer; font-size: 12px; font-family: monospace;
  }
  #toolbar button:hover { background: #ff8c5a; }
  #toolbar button.secondary { background: #283356; }
  #toolbar button.secondary:hover { background: #3a4a7a; }
  #toolbar span { color: #888; font-size: 11px; }

  #export-modal {
    display: none; position: fixed; inset: 0; z-index: 99999; background: rgba(0,0,0,0.7);
    align-items: center; justify-content: center;
  }
  #export-modal.show { display: flex; }
  #export-modal .modal-body {
    background: #1a1a2e; border: 1px solid #444; border-radius: 12px; padding: 24px;
    width: 600px; max-height: 80vh; overflow-y: auto;
  }
  #export-modal pre {
    background: #041133; padding: 16px; border-radius: 8px; font-size: 12px;
    overflow-x: auto; white-space: pre-wrap; word-break: break-all; color: #b6c4ff;
    border: 1px solid #283356;
  }
  #export-modal button {
    margin-top: 12px; background: #ff6b35; color: white; border: none; padding: 8px 20px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }

  .hint { color: #666; font-size: 11px; margin-top: 8px; line-height: 1.6; }
  .el-list { margin-top: 8px; }
  .el-list div {
    padding: 4px 8px; margin: 2px 0; background: #041133; border-radius: 4px; cursor: pointer;
    font-size: 11px; border: 1px solid transparent;
  }
  .el-list div:hover { border-color: #efbd8a; }
  .el-list div.active { border-color: #ff6b35; background: #1a1a2e; }
</style>
</head>
<body>

<div id="preview-panel">
  <div id="toolbar">
    <span>📐 编辑器</span>
    <button onclick="toggleEdit()">开/关编辑</button>
    <button class="secondary" onclick="applyToCode()">💾 保存到代码</button>
    <button class="secondary" onclick="exportCSS()">📋 导出</button>
    <button class="secondary" onclick="resetAll()">↺ 重置</button>
  </div>
  <div id="phone-frame">
    <iframe id="phone-iframe" src="index.html"></iframe>
  </div>
</div>

<div id="props-panel">
  <h2>📐 属性面板</h2>
  <div id="element-list" class="el-list"></div>
  <hr style="border-color:#283356;margin:12px 0">
  <div id="props-content">
    <p class="hint">1. 点击「开/关编辑」<br>2. 点击元素列表或画面中的元素<br>3. 拖拽移动 / 拖右下角缩放<br>4. 右侧面板修改属性值<br>5. 调好后点「导出」</p>
  </div>
</div>

<div id="export-modal">
  <div class="modal-body">
    <h3 style="color:#efbd8a;margin-bottom:12px;">导出 CSS 代码</h3>
    <pre id="export-code"></pre>
    <button onclick="copyExport()">复制到剪贴板</button>
    <button onclick="closeExport()" style="background:#283356;margin-left:8px;">关闭</button>
  </div>
</div>

<script>
const iframe = document.getElementById('phone-iframe');
const propsContent = document.getElementById('props-content');
const elList = document.getElementById('element-list');
let editEnabled = false;

// 可编辑元素配置
const editableConfig = {
  // 角色
  'char-left-wrap':  { label: '芙宁娜(容器)', type: 'box', props: ['width','height'] },
  'char-right-wrap': { label: '胡桃(容器)',   type: 'box', props: ['width','height'] },
  'char-left-name':  { label: '芙宁娜(名字)', type: 'text' },
  'char-right-name': { label: '胡桃(名字)',   type: 'text' },
  // 标题区
  'title-section':   { label: '标题区(容器)', type: 'box', props: ['marginTop','marginBottom','padding','transform'] },
  'subtitle':        { label: '副标题',       type: 'text' },
  'main-title':      { label: '主标题',       type: 'text' },
  'slogan':          { label: '标语',         type: 'text' },
  'desc-text':       { label: '描述文字',     type: 'text' },
  // 按钮
  'btn-start':       { label: '开始游戏按钮', type: 'box', props: ['width','padding'] },
  'btn-start-label': { label: '开始游戏文字', type: 'text' },
  'func-btn-1':      { label: '我的学习按钮', type: 'box', props: ['padding'] },
  'func-btn-1-text': { label: '我的学习文字', type: 'text' },
  'func-btn-2':      { label: '知识点库按钮', type: 'box', props: ['padding'] },
  'func-btn-2-text': { label: '知识点库文字', type: 'text' },
  'func-btn-3':      { label: '错题本按钮',   type: 'box', props: ['padding'] },
  'func-btn-3-text': { label: '错题本文字',   type: 'text' },
  'func-btn-4':      { label: '成就勋章按钮', type: 'box', props: ['padding'] },
  'func-btn-4-text': { label: '成就勋章文字', type: 'text' },
};

iframe.addEventListener('load', () => {
  setTimeout(injectEditor, 800);
});

function injectEditor() {
  const doc = iframe.contentDocument;
  const win = iframe.contentWindow;

  // 注入编辑模式CSS到iframe
  const style = doc.createElement('style');
  style.id = 'editor-injected-style';
  style.textContent = `
    body.ed-editing [data-ed] {
      outline: 2px dashed rgba(239,189,138,0.8) !important;
      cursor: move !important;
      position: relative !important;
    }
    body.ed-editing [data-ed]:hover {
      outline: 2px solid #efbd8a !important;
      outline-offset: 2px !important;
    }
    body.ed-editing [data-ed] .ed-label {
      display: block !important;
    }
    body.ed-editing [data-ed] .ed-resize {
      display: block !important;
    }
    body.ed-editing [data-ed] img {
      pointer-events: none !important;
    }
    body.ed-editing [data-ed].ed-selected {
      outline: 2px solid #ff6b35 !important;
      outline-offset: 2px !important;
    }
    .ed-label {
      display: none;
      position: absolute; top: -22px; left: 0; background: #efbd8a; color: #000;
      font-size: 10px; padding: 2px 8px; border-radius: 3px; font-family: monospace;
      white-space: nowrap; pointer-events: none; z-index: 999999;
    }
    .ed-resize {
      display: none;
      position: absolute; bottom: -8px; right: -8px; width: 18px; height: 18px;
      background: #ff6b35; border-radius: 3px; cursor: nwse-resize; z-index: 99999999;
      border: 2px solid #fff;
    }
  `;
  doc.head.appendChild(style);

  // 标记所有可编辑元素
  Object.keys(editableConfig).forEach(id => {
    const el = doc.getElementById(id);
    if (!el) return;
    el.setAttribute('data-ed', id);

    // 标签
    const label = doc.createElement('div');
    label.className = 'ed-label';
    label.textContent = editableConfig[id].label;
    el.appendChild(label);

    // 缩放手柄
    const handle = doc.createElement('div');
    handle.className = 'ed-resize';
    el.appendChild(handle);
  });

  // 构建元素列表
  buildElementList();
}

// ===== 拖拽系统（Pointer Events + Pointer Capture）=====
let dragEl = null, dragStartX = 0, dragStartY = 0, dragOrigTx = 0, dragOrigTy = 0;
let resizeEl = null, resizeStartX = 0, resizeStartY = 0, resizeOrigW = 0, resizeOrigH = 0;
let overlay = null;

function ensureOverlay() {
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'ed-overlay';
    // touch-action:none 防止触摸滚动；pointer-events:auto 确保可点击
    overlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;z-index:9999;cursor:crosshair;display:none;background:rgba(255,100,0,0.06);touch-action:none;';
    document.getElementById('phone-frame').appendChild(overlay);

    // === 所有事件都绑定在覆盖层上 ===
    overlay.addEventListener('pointerdown', onPointerDown);
    overlay.addEventListener('pointermove', onPointerMove);
    overlay.addEventListener('pointerup', onPointerUp);
    overlay.addEventListener('pointercancel', onPointerUp);
  }
  return overlay;
}

function onPointerDown(e) {
  if (!editEnabled) return;
  e.preventDefault();

  const doc = iframe.contentDocument;
  if (!doc) return;

  // 坐标转换：页面坐标 → iframe 内坐标
  const iframeRect = iframe.getBoundingClientRect();
  const ix = e.clientX - iframeRect.left;
  const iy = e.clientY - iframeRect.top;

  // 隐藏覆盖层，用 elementFromPoint 找 iframe 内元素
  overlay.style.visibility = 'hidden';
  void overlay.offsetHeight; // 强制重排
  const elUnder = doc.elementFromPoint(ix, iy);
  overlay.style.visibility = 'visible';

  if (!elUnder) return;

  // 缩放手柄？
  if (elUnder.classList.contains('ed-resize')) {
    resizeEl = elUnder.parentElement;
    const rect = resizeEl.getBoundingClientRect();
    resizeStartX = e.clientX;
    resizeStartY = e.clientY;
    resizeOrigW = rect.width;
    resizeOrigH = rect.height;
    overlay.setPointerCapture(e.pointerId);
    return;
  }

  // 可编辑元素？
  const target = elUnder.closest ? elUnder.closest('[data-ed]') : null;
  if (target) {
    doc.querySelectorAll('.ed-selected').forEach(el => el.classList.remove('ed-selected'));
    target.classList.add('ed-selected');
    const id = target.getAttribute('data-ed');
    highlightListItem(id);
    updatePropsPanel(target, id);

    dragEl = target;
    dragStartX = e.clientX;
    dragStartY = e.clientY;

    const matrix = iframe.contentWindow.getComputedStyle(target).transform;
    if (matrix && matrix !== 'none') {
      const m = matrix.match(/matrix\((.+)\)/);
      if (m) { const v = m[1].split(',').map(Number); dragOrigTx = v[4]; dragOrigTy = v[5]; }
      else { dragOrigTx = 0; dragOrigTy = 0; }
    } else { dragOrigTx = 0; dragOrigTy = 0; }

    // 关键：pointer capture 确保后续 move/up 事件都发到覆盖层
    overlay.setPointerCapture(e.pointerId);
    return;
  }

  // 空白区域取消选中
  doc.querySelectorAll('.ed-selected').forEach(el => el.classList.remove('ed-selected'));
  propsContent.innerHTML = '<p class="hint">点击元素来编辑</p>';
  elList.querySelectorAll('div').forEach(d => d.classList.remove('active'));
}

function onPointerMove(e) {
  if (dragEl) {
    e.preventDefault();
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    dragEl.style.transform = 'translate(' + (dragOrigTx + dx) + 'px,' + (dragOrigTy + dy) + 'px)';
    const id = dragEl.getAttribute('data-ed');
    if (id) updatePropsPanel(dragEl, id);
  }
  if (resizeEl) {
    e.preventDefault();
    const dx = e.clientX - resizeStartX;
    const dy = e.clientY - resizeStartY;
    resizeEl.style.width = Math.max(30, resizeOrigW + dx) + 'px';
    resizeEl.style.height = Math.max(30, resizeOrigH + dy) + 'px';
    resizeEl.style.maxWidth = 'none';
    resizeEl.style.maxHeight = 'none';
    const id = resizeEl.getAttribute('data-ed');
    if (id) updatePropsPanel(resizeEl, id);
  }
}

function onPointerUp(e) {
  dragEl = null;
  resizeEl = null;
  try { overlay.releasePointerCapture(e.pointerId); } catch(_) {}
}

function buildElementList() {
  const doc = iframe.contentDocument;
  let html = '';
  Object.keys(editableConfig).forEach(id => {
    const cfg = editableConfig[id];
    const el = doc ? doc.getElementById(id) : null;
    const icon = el ? '✅' : '❌';
    html += '<div data-list-id="' + id + '" onclick="selectById(\'' + id + '\')">' + icon + ' ' + cfg.label + ' <span style="color:#555">#' + id + '</span></div>';
  });
  elList.innerHTML = html;
}

function highlightListItem(id) {
  elList.querySelectorAll('div').forEach(d => d.classList.remove('active'));
  const item = elList.querySelector('[data-list-id="' + id + '"]');
  if (item) item.classList.add('active');
}

function toggleEdit() {
  editEnabled = !editEnabled;
  const doc = iframe.contentDocument;

  if (editEnabled) {
    doc.body.classList.add('ed-editing');
    // 用 CSS 禁用动画（否则 float 动画会覆盖拖拽的 transform）
    const forceStyle = doc.createElement('style');
    forceStyle.id = 'ed-force-pe';
    forceStyle.textContent = 'body.ed-editing *, body.ed-editing *::before, body.ed-editing *::after { animation: none !important; }';
    doc.head.appendChild(forceStyle);
    // 显示覆盖层（拦截所有鼠标事件）
    ensureOverlay().style.display = 'block';
    // 阻止所有链接和按钮的点击跳转
    doc.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); }, true);
    });
  } else {
    doc.body.classList.remove('ed-editing');
    doc.querySelectorAll('.ed-selected').forEach(el => el.classList.remove('ed-selected'));
    // 移除强制样式
    const forceStyle = doc.getElementById('ed-force-pe');
    if (forceStyle) forceStyle.remove();
    // 隐藏覆盖层
    if (overlay) overlay.style.display = 'none';
    propsContent.innerHTML = '<p class="hint">编辑模式已关闭</p>';
    elList.querySelectorAll('div').forEach(d => d.classList.remove('active'));
  }
}

function selectById(id) {
  const doc = iframe.contentDocument;
  const el = doc.getElementById(id);
  if (!el) return;

  doc.querySelectorAll('.ed-selected').forEach(e => e.classList.remove('ed-selected'));
  el.classList.add('ed-selected');
  highlightListItem(id);
  updatePropsPanel(el, id);
}

function updatePropsPanel(el, id) {
  const cfg = editableConfig[id];
  if (!cfg) return;
  const win = iframe.contentWindow;
  const rect = el.getBoundingClientRect();

  let html = '<div class="prop-group">';
  html += '<h3>🏷️ ' + cfg.label + ' <span style="color:#555">#' + id + '</span></h3>';

  if (cfg.type === 'text') {
    // 文本元素：显示并可编辑文本内容
    html += '<div class="prop-row"><label>文本</label>';
    html += '<input value="' + (el.textContent || '').replace(/"/g, '&quot;') + '" onchange="setText(\'' + id + '\',this.value)" style="flex:1">';
    html += '</div>';
  }

  html += '<div class="prop-row"><label>实际宽</label><input value="' + Math.round(rect.width) + '" readonly><span class="unit">px</span></div>';
  html += '<div class="prop-row"><label>实际高</label><input value="' + Math.round(rect.height) + '" readonly><span class="unit">px</span></div>';
  html += '<div class="prop-row"><label>transform</label><input value="' + (el.style.transform || 'none') + '" onchange="setTransform(\'' + id + '\',this.value)"></div>';

  if (cfg.props) {
    cfg.props.forEach(function(prop) {
      const val = el.style[prop] || win.getComputedStyle(el)[prop];
      html += '<div class="prop-row"><label>' + prop + '</label>';
      html += '<input value="' + val + '" onchange="setProp(\'' + id + '\',\'' + prop + '\',this.value)">';
      html += '<span class="unit"></span></div>';
    });
  }

  html += '<div class="prop-row"><label>class</label>';
  html += '<input value="' + el.className + '" onchange="setClass(\'' + id + '\',this.value)" style="font-size:10px">';
  html += '</div>';
  html += '<div style="margin-top:10px"><button onclick="resetEl(\'' + id + '\')">↺ 重置此元素</button></div>';
  html += '</div>';

  propsContent.innerHTML = html;
}

function setProp(id, prop, value) {
  const el = iframe.contentDocument.getElementById(id);
  if (!el) return;
  el.style[prop] = value;
  setTimeout(function() { updatePropsPanel(el, id); }, 50);
}

function setText(id, value) {
  const el = iframe.contentDocument.getElementById(id);
  if (!el) return;
  el.textContent = value;
  setTimeout(function() { updatePropsPanel(el, id); }, 50);
}

function setTransform(id, value) {
  const el = iframe.contentDocument.getElementById(id);
  if (!el) return;
  el.style.transform = value;
  setTimeout(function() { updatePropsPanel(el, id); }, 50);
}

function setClass(id, value) {
  const el = iframe.contentDocument.getElementById(id);
  if (!el) return;
  el.className = value;
  setTimeout(function() { updatePropsPanel(el, id); }, 50);
}

function resetEl(id) {
  const el = iframe.contentDocument.getElementById(id);
  if (!el) return;
  el.style.width = '';
  el.style.height = '';
  el.style.transform = '';
  el.style.maxWidth = '';
  el.style.maxHeight = '';
  el.style.padding = '';
  setTimeout(function() { updatePropsPanel(el, id); }, 100);
}

function exportCSS() {
  const doc = iframe.contentDocument;
  let css = '/* 首页编辑器导出 - 手机端(390px) */\n\n';

  Object.keys(editableConfig).forEach(function(id) {
    const el = doc.getElementById(id);
    if (!el) return;
    const cfg = editableConfig[id];
    const rect = el.getBoundingClientRect();
    const s = el.style;

    css += '/* ' + cfg.label + ' (#' + id + ') */\n';
    css += '  实际尺寸: ' + Math.round(rect.width) + 'px x ' + Math.round(rect.height) + 'px\n';
    if (s.width)    css += '  width: ' + s.width + '\n';
    if (s.height)   css += '  height: ' + s.height + '\n';
    if (s.transform) css += '  transform: ' + s.transform + '\n';
    if (s.padding)  css += '  padding: ' + s.padding + '\n';
    css += '  class: ' + el.className + '\n\n';
  });

  document.getElementById('export-code').textContent = css;
  document.getElementById('export-modal').classList.add('show');
}

function copyExport() {
  const code = document.getElementById('export-code').textContent;
  navigator.clipboard.writeText(code).then(function() { alert('已复制！'); });
}

function closeExport() {
  document.getElementById('export-modal').classList.remove('show');
}

function resetAll() {
  if (!confirm('确定重置？')) return;
  iframe.src = iframe.src;
  editEnabled = false;
  propsContent.innerHTML = '<p class="hint">已重置</p>';
}

function applyToCode() {
  const doc = iframe.contentDocument;
  const changes = {};
  const textChanges = {};

  Object.keys(editableConfig).forEach(function(id) {
    const el = doc.getElementById(id);
    if (!el) return;
    const cfg = editableConfig[id];

    // 收集 style 变化
    const inlineStyle = el.getAttribute('style');
    if (inlineStyle && inlineStyle.trim()) {
      changes[id] = inlineStyle;
    }

    // 收集文本变化
    if (cfg.type === 'text') {
      const currentText = el.textContent.trim();
      // 用原始 HTML 中的文本作为对比基准（简单方式：直接保存当前文本）
      textChanges[id] = currentText;
    }
  });

  const changeCount = Object.keys(changes).length + Object.keys(textChanges).length;
  if (changeCount === 0) {
    alert('没有检测到修改，请先编辑元素。');
    return;
  }

  // 读取原始 index.html
  fetch('index.html')
    .then(function(r) { return r.text(); })
    .then(function(html) {
      // 写入 style 变化
      Object.keys(changes).forEach(function(id) {
        const style = changes[id];
        const styleRegex = new RegExp('(id="' + id + '"[^>]*?)style="[^"]*"([^>]*>)', 'i');
        const regex = new RegExp('(id="' + id + '"[^>]*?)(>)', 'i');
        if (html.match(styleRegex)) {
          html = html.replace(styleRegex, '$1style="' + style + '"$2');
        } else if (html.match(regex)) {
          html = html.replace(regex, '$1 style="' + style + '"$2');
        }
      });

      // 写入文本变化
      Object.keys(textChanges).forEach(function(id) {
        const newText = textChanges[id];
        // 查找 id="xxx" 元素的文本内容并替换
        const elRegex = new RegExp('(id="' + id + '"[^>]*>)([\\s\\S]*?)(</(?:span|div|h1|h2|h3|p|button)>)', 'i');
        const match = html.match(elRegex);
        if (match) {
          html = html.replace(elRegex, '$1' + newText + '$3');
        }
      });

      // 保存到 index.html
      const blob = new Blob([html], {type: 'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      a.click();
      URL.revokeObjectURL(url);

      alert('✅ 已下载修改后的 index.html（共 ' + changeCount + ' 处修改）\n请用下载的文件替换原文件。');
    })
    .catch(function(err) {
      alert('保存失败：' + err.message);
    });
}
</script>
</body>
</html>
