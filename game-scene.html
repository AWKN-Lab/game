      { type: "knowledge", id: "k_louis_death", name: "👑 路易十六被处死", desc: "1793年1月21日，路易十六被送上断头台，标志着法国封建君主制的终结。他是第一个被以「法律名义」处死的欧洲国王，震惊了整个欧洲王室。这一事件也开启了恐怖统治的序幕。", category: "历史" },

      { type: "knowledge", id: "k_terror_rule", name: "💀 恐怖统治的教训", desc: "1793-1794年，罗伯斯庇尔领导的雅各宾派实行恐怖统治，以「保卫革命」为名大规模处决「嫌疑人」。巴黎革命法庭判处约1376人死刑，其中仅14%有确凿叛国证据。这段历史深刻警示：不受制约的权力，无论打着什么旗号，最终都会走向暴政。", category: "正义" },

      { speaker: null, text: "1794年7月，热月政变。罗伯斯庇尔被送上断头台。雅各宾派统治结束。", scene: "第四幕 · 热月政变" },
      { type: "knowledge", id: "k_thermidor", name: "🔥 热月政变", desc: "1794年7月27日（热月9日），反对罗伯斯庇尔的议员联合发动政变，逮捕并处死了罗伯斯庇尔。恐怖统治结束，但法国政局依然动荡，直到1799年拿破仑上台。这一事件说明：以暴力推翻暴力，往往只会带来新的暴力循环。", category: "历史" },

      { type: "knowledge", id: "k_brumaire", name: "⚔️ 雾月政变", desc: "1799年11月9日（雾月18日），拿破仑·波拿巴发动政变，推翻督政府，建立执政府，自任第一执政。这标志着法国从共和制向军事独裁的转变，也开启了拿破仑时代。政变说明：在动荡时期，强人往往能利用人们对「秩序」的渴望夺取权力。", category: "历史" },
      { speaker: "napoleon", text: "混乱结束了。法国需要秩序，需要法律，需要一个强有力的领导人。", scene: "第五幕 · 拿破仑", charLeft: "napoleon" },
      { speaker: "napoleon", text: "（独白）他们说我是暴君。可我给了法国秩序，给了欧洲法典。没有我，法国会怎样？大革命喊了十年自由平等，可自由平等喂不饱一个面包师的孩子。" },
      { speaker: "napoleon", text: "（独白）科西嘉岛上的穷小子……我走到今天，靠的是炮火和运气。可运气总有用完的一天。我比任何人都清楚，王冠是用骷髅堆起来的。" },
      { speaker: "napoleon", text: "（低声）也许...我和路易十六没有区别。我们都以为自己是对的。可他对不起法国，我对不起的……是那些再也没能回家的士兵。" },
      { speaker: "napoleon", text: "（对身边的年轻士兵）你叫什么名字？多大了？" },
      { speaker: null, text: "一个瘦弱的年轻士兵立正回答：「报告将军，我叫让-皮埃尔，十七岁。」" },
      { speaker: "napoleon", text: "（拍了拍他的肩膀）十七岁……和我第一次上战场一样大。让-皮埃尔，记住——活着回来。比任何勋章都重要。" },
      { speaker: null, text: "年轻士兵眼眶微红，用力点了点头。拿破仑转过身，脸上的温情一闪而逝，恢复了冷峻的表情。" },
      { speaker: "napoleon", text: "1804年，我加冕为皇帝，建立了法兰西第一帝国。" },
      { speaker: "napoleon", text: "我最伟大的功绩，是颁布了《拿破仑法典》。它确认了资产阶级私有制，废除了封建特权，确立了自由平等的原则。" },
      { type: "knowledge", id: "k_napoleon_code", name: "📋 《拿破仑法典》的双重遗产", desc: "《拿破仑法典》（1804年）确立了法律面前人人平等、契约自由、私有财产保护等现代民法基本原则，影响了全球40多个国家的法律体系。但拿破仑本人通过政变夺权、恢复奴隶制、发动侵略战争，说明「好的制度」和「好的执行者」是两回事。制度需要人来执行，但更需要制衡来约束人。", category: "法治" },

      { type: 'star_choice', id: 'fr_star_005', title: '革命成果如何制度化传承？', scene: '1804年，巴黎',
        knowledgeIds: ['fr_napoleon_code'],
        Text: '拿破仑说："我真正的光荣并非打了40次胜仗，滑铁卢之战抹去了关于这一切的记忆。但有一样东西是不会被人忘却的，它将永垂不朽——那就是我的民法典。"《拿破仑法典》将革命成果（自由、平等、法治）以法律形式固定下来，影响了全世界100多个国家。',

      { type: "knowledge", id: "k_waterloo", name: "⚔️ 滑铁卢战役", desc: "1815年6月18日，拿破仑在比利时滑铁卢被反法联军击败，标志着拿破仑帝国的终结和法国大革命时代的结束。这场战役后，欧洲进入「维也纳体系」时期，封建势力短暂复辟。但大革命播下的自由民主种子已不可逆转。", category: "历史" },

    // ===== 语音开关 =====
    function toggleVoice(event) {
      if (typeof VoiceManager === 'undefined') return;
      if (event) event.stopPropagation();
      var newState = VoiceManager.toggle();
      var btn = document.getElementById('voiceToggleBtn');
      if (btn) {
        btn.textContent = newState ? '语音 ON' : '语音 OFF';
        btn.style.background = newState ? 'rgba(212,165,116,0.3)' : 'rgba(255,255,255,0.1)';
        btn.style.borderColor = newState ? '#d4a574' : 'rgba(212,165,116,0.5)';
      }
      localStorage.setItem('voiceEnabled', newState ? '1' : '0');
    }

    // 页面加载时恢复语音状态
    document.addEventListener('DOMContentLoaded', function() {
      var saved = localStorage.getItem('voiceEnabled');
      if (saved === '1' && typeof VoiceManager !== 'undefined') {
        VoiceManager.toggle();
        var btn = document.getElementById('voiceToggleBtn');
        if (btn) {
          btn.textContent = '语音 ON';
          btn.style.background = 'rgba(212,165,116,0.3)';
          btn.style.borderColor = '#d4a574';
        }
      }
    });
</script>
