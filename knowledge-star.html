<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>知识星球 · 动态生长树</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0f1e;
            overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
        }
        #graph {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, #14223c 0%, #0a0f1e 70%);
        }
        .node-group {
            cursor: grab;
            transition: filter 0.2s;
        }
        .node-group:hover {
            filter: brightness(1.3) drop-shadow(0 0 12px currentColor);
        }
        .node-group:active { cursor: grabbing; }
        .link {
            stroke: #5f8fbf;
            stroke-opacity: 0.25;
            stroke-width: 1.5;
            transition: stroke-opacity 0.2s;
        }
        .link:hover { stroke-opacity: 0.7; }
        .node-label {
            font-size: 11px;
            font-weight: 500;
            fill: #eef5ff;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            user-select: none;
        }
        .controls {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }
        .btn {
            background: rgba(20, 35, 60, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid #3a5a8c;
            color: #e0edff;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0,0,0,0.4);
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }
        .btn:hover {
            background: #2a4a7a;
            border-color: #7aa5e6;
            color: white;
            transform: scale(1.02);
        }
        .hint {
            position: fixed;
            bottom: 24px;
            left: 24px;
            color: #8da4d0;
            font-size: 13px;
            background: rgba(10, 18, 30, 0.6);
            backdrop-filter: blur(5px);
            padding: 8px 16px;
            border-radius: 30px;
            border-left: 3px solid #55ccff;
        }
    </style>
</head>
<body>
    <div id="graph"></div>
    <div class="hint">✨ 拖拽移动 · 滚轮缩放</div>
    <div class="controls">
        <button class="btn" id="resetBtn">⟲ 重置视图</button>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        (function(){
            "use strict";

            const width = window.innerWidth;
            const height = window.innerHeight;

            // 科目颜色
            const subjectColor = {
                history: '#55ccff',
                daofa:   '#22ff88',
                default: '#a0c0e0'
            };

            // 节点半径: core=14, major=6, minor=4
            const radiusMap = {
                core: 14,
                major: 6,
                minor: 4
            };

            // 核心/大分支知识点 ID
            const CORE_NODES = [
                'fr_h4','ir_h2','k_declaration','k_wuxu_08','k_sanminzhuyi'
            ];
            const MAJOR_NODES = [
                'fr_h3','fr_h12','ir_h5','ir_h8',
                'k_lexington','k_constitution',
                'k_wuxu_01','k_wuxu_05',
                'k_wuchang','k_zhonghua_minguo'
            ];

            // 每个剧本的聚簇中心 (围绕画布中心环形分布)
            const scriptCenters = {
                'french_revolution':    { x: width * 0.35, y: height * 0.35 },
                'industrial_revolution':{ x: width * 0.65, y: height * 0.35 },
                'american_revolution':  { x: width * 0.25, y: height * 0.65 },
                'wuxu_reform':          { x: width * 0.50, y: height * 0.65 },
                'xinhai_revolution':    { x: width * 0.75, y: height * 0.65 }
            };

            // 扁平化节点数组 (直接以剧本为顶层，无科目根)
            let nodes = [];
            let links = [];
            let svg, g, zoom, simulation;

            // ---------- 加载数据 ----------
            async function loadKnowledgeData() {
                try {
                    const data = await (await fetch('data/knowledge_points.json')).json();
                    nodes = [];
                    links = [];

                    for (const [scriptId, categories] of Object.entries(data)) {
                        const center = scriptCenters[scriptId] || { x: width/2, y: height/2 };

                        // 历史知识点
                        if (categories.history) {
                            categories.history.forEach(kp => {
                                const sizeType = getSizeType(kp.id);
                                nodes.push({
                                    id: kp.id,
                                    name: kp.name,
                                    content: kp.content,
                                    subject: 'history',
                                    scriptId: scriptId,
                                    sizeType: sizeType,
                                    r: radiusMap[sizeType],
                                    cx: center.x,
                                    cy: center.y
                                });
                            });
                        }

                        // 道法知识点
                        if (categories.daofa) {
                            categories.daofa.forEach(kp => {
                                const sizeType = getSizeType(kp.id);
                                nodes.push({
                                    id: kp.id,
                                    name: kp.name,
                                    content: kp.content,
                                    subject: 'daofa',
                                    scriptId: scriptId,
                                    sizeType: sizeType,
                                    r: radiusMap[sizeType],
                                    cx: center.x,
                                    cy: center.y
                                });
                            });
                        }
                    }

                    // 构建连线: 同剧本同科目内，core 与 major/minor 相连
                    const nodeMap = new Map(nodes.map(n => [n.id, n]));
                    nodes.forEach(node => {
                        if (node.sizeType !== 'core') {
                            // 找到同剧本同科目的 core 节点作为父节点
                            const coreParent = nodes.find(n =>
                                n.scriptId === node.scriptId &&
                                n.subject === node.subject &&
                                n.sizeType === 'core'
                            );
                            if (coreParent) {
                                links.push({
                                    source: coreParent.id,
                                    target: node.id,
                                    strength: 0.3
                                });
                            }
                        }
                    });

                    updateGraph();
                } catch (err) {
                    console.error('加载失败:', err);
                }
            }

            function getSizeType(id) {
                if (CORE_NODES.includes(id)) return 'core';
                if (MAJOR_NODES.includes(id)) return 'major';
                return 'minor';
            }

            // ---------- 初始化 SVG ----------
            function initSvg() {
                svg = d3.select('#graph')
                    .append('svg')
                    .attr('width', width)
                    .attr('height', height)
                    .attr('viewBox', [0, 0, width, height]);

                const defs = svg.append('defs');
                const filter = defs.append('filter')
                    .attr('id', 'glow')
                    .attr('x', '-50%').attr('y', '-50%')
                    .attr('width', '200%').attr('height', '200%');
                filter.append('feGaussianBlur')
                    .attr('stdDeviation', '3')
                    .attr('result', 'coloredBlur');
                const feMerge = filter.append('feMerge');
                feMerge.append('feMergeNode').attr('in', 'coloredBlur');
                feMerge.append('feMergeNode').attr('in', 'SourceGraphic');

                g = svg.append('g');

                zoom = d3.zoom()
                    .scaleExtent([0.3, 4])
                    .on('zoom', (event) => g.attr('transform', event.transform));
                svg.call(zoom);
                svg.call(zoom.transform, d3.zoomIdentity.translate(width*0.05, height*0.05).scale(0.85));
            }

            // ---------- 力导向 + 渲染 ----------
            function updateGraph() {
                if (simulation) simulation.stop();

                simulation = d3.forceSimulation(nodes)
                    .force('link', d3.forceLink(links)
                        .id(d => d.id)
                        .strength(d => d.strength || 0.2)
                        .distance(d => {
                            const src = nodes.find(n => n.id === d.source.id || n.id === d.source);
                            const tgt = nodes.find(n => n.id === d.target.id || n.id === d.target);
                            return (src && tgt) ? src.r + tgt.r + 30 : 50;
                        })
                    )
                    .force('charge', d3.forceManyBody()
                        .strength(d => -80 - d.r * 4)
                        .distanceMax(200)
                    )
                    .force('collision', d3.forceCollide()
                        .radius(d => d.r + 6)
                        .strength(0.8)
                        .iterations(2)
                    )
                    .force('x', d3.forceX(d => d.cx).strength(0.06))
                    .force('y', d3.forceY(d => d.cy).strength(0.06))
                    .force('center', d3.forceCenter(width/2, height/2).strength(0.01))
                    .alpha(0.8)
                    .alphaDecay(0.02);

                // 渲染连线
                const linkSel = g.selectAll('.link')
                    .data(links, d => `${d.source.id||d.source}-${d.target.id||d.target}`);
                linkSel.join(
                    enter => enter.append('line')
                        .attr('class', 'link')
                        .attr('stroke', d => {
                            const src = nodes.find(n => n.id === (d.source.id||d.source));
                            return subjectColor[src?.subject] || '#7f9fbf';
                        }),
                    update => update,
                    exit => exit.remove()
                );

                // 渲染节点
                const sorted = [...nodes].sort((a,b) => b.r - a.r);
                const nodeSel = g.selectAll('.node-group').data(sorted, d => d.id);

                const drag = d3.drag()
                    .on('start', (event,d) => {
                        if (!event.active) simulation.alphaTarget(0.3).restart();
                        d.fx = d.x; d.fy = d.y;
                    })
                    .on('drag', (event,d) => {
                        d.fx = event.x; d.fy = event.y;
                    })
                    .on('end', (event,d) => {
                        if (!event.active) simulation.alphaTarget(0);
                        d.fx = null; d.fy = null;
                    });

                const enter = nodeSel.enter()
                    .append('g')
                    .attr('class', 'node-group')
                    .call(drag);

                enter.append('circle')
                    .attr('r', d => d.r)
                    .attr('fill', d => subjectColor[d.subject] || subjectColor.default)
                    .attr('filter', 'url(#glow)')
                    .attr('stroke', '#ffffff20')
                    .attr('stroke-width', 1.2);

                enter.append('text')
                    .attr('class', 'node-label')
                    .text(d => d.name)
                    .attr('dy', d => d.r + 10)
                    .attr('font-size', d => Math.min(d.r * 0.5, 12));

                nodeSel.select('circle')
                    .attr('r', d => d.r)
                    .attr('fill', d => subjectColor[d.subject] || subjectColor.default);
                nodeSel.select('text')
                    .text(d => d.name)
                    .attr('dy', d => d.r + 10)
                    .attr('font-size', d => Math.min(d.r * 0.5, 12));
                nodeSel.exit().remove();

                // tick: 边界约束 + 位置更新
                simulation.on('tick', () => {
                    const margin = 80;
                    nodes.forEach(d => {
                        d.x = Math.max(margin, Math.min(width - margin, d.x));
                        d.y = Math.max(margin, Math.min(height - margin, d.y));
                    });

                    g.selectAll('.link')
                        .attr('x1', d => d.source.x)
                        .attr('y1', d => d.source.y)
                        .attr('x2', d => d.target.x)
                        .attr('y2', d => d.target.y);

                    g.selectAll('.node-group')
                        .attr('transform', d => `translate(${d.x},${d.y})`);
                });

                simulation.alpha(0.5).restart();
            }

            // ---------- 交互 ----------
            function resetView() {
                svg.transition().duration(500)
                    .call(zoom.transform, d3.zoomIdentity.translate(width*0.05, height*0.05).scale(0.85));
            }

            // ---------- 启动 ----------
            initSvg();
            loadKnowledgeData();
            document.getElementById('resetBtn').addEventListener('click', resetView);
        })();
    </script>
</body>
</html>
