<script>
function navigateTo(url) {
  document.body.style.opacity = '0';
  document.body.style.transition = 'opacity 0.3s ease';
  setTimeout(function() { window.location.href = url; }, 220);
}

function showToast(msg) {
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(40,51,86,0.95);color:#dbe1ff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:10001;backdrop-filter:blur(10px);border:1px solid rgba(239,189,138,0.3);';
  document.body.appendChild(t);
  setTimeout(function() {
    t.style.opacity = '0';
    t.style.transition = 'opacity 0.3s';
    setTimeout(function() { t.remove(); }, 300);
  }, 1800);
}

function simpleHash(str) {
  var hash = 5381;
  for (var i = 0; i < str.length; i++) {
    hash = ((hash << 5) + hash) + str.charCodeAt(i);
    hash = hash & hash;
  }
  return 'h_' + Math.abs(hash).toString(36);
}

document.addEventListener('DOMContentLoaded', function() {
  var menuToggle = document.getElementById('menu-toggle');
  var sidebar = document.getElementById('sidebar');
  if (menuToggle && sidebar) {
    menuToggle.addEventListener('click', function() {
      sidebar.classList.toggle('-translate-x-full');
      sidebar.classList.toggle('translate-x-0');
    });
  }

  var startBtn = document.getElementById('btn-start');
  if (startBtn) {
    startBtn.addEventListener('click', function() {
      navigateTo('script-select.html');
    });
  }

  document.querySelectorAll('aside button').forEach(function(btn) {
    var text = btn.textContent;
    if (text.includes('主页')) btn.addEventListener('click', function() { navigateTo('index.html'); });
    else if (text.includes('剧本选择')) btn.addEventListener('click', function() { navigateTo('script-select.html'); });
    else if (text.includes('我的学习')) btn.addEventListener('click', function() { navigateTo('my-learning.html'); });
    else if (text.includes('知识点库')) btn.addEventListener('click', function() { navigateTo('knowledge-base.html'); });
    else if (text.includes('错题本')) btn.addEventListener('click', function() { navigateTo('error-log.html'); });
    else if (text.includes('成就勋章')) btn.addEventListener('click', function() { navigateTo('achievements.html'); });
  });

  var completedCount = window.DataStore ? ['french_revolution','industrial_revolution','american_revolution','wuxu_reform','xinhai_revolution'].filter(function(id) {
    return DataStore.isScriptCompleted(id);
  }).length : 0;
  var visionEl = document.querySelector('.vision-orb-text');
  if (visionEl) visionEl.textContent = completedCount + '/5';
});
</script>

<script>
// ====================== 登录功能 ======================
(function() {
  var loginModal = document.getElementById('login-modal');
  if (!loginModal) return;

  var loginForm = document.getElementById('login-form');
  var logoutSection = document.getElementById('logout-section');
  var loginTitle = document.getElementById('login-modal-title');
  var usernameInput = document.getElementById('login-username');
  var passwordInput = document.getElementById('login-password');
  var usernameDisplay = document.getElementById('login-username-display');
  var loginTip = document.getElementById('login-tip');
  var backdrop = document.getElementById('login-modal-backdrop');

  function checkLoginState() {
    var isLoggedIn = localStorage.getItem('st_logged_in') === 'true';
    var savedUsername = localStorage.getItem('st_username');
    if (isLoggedIn && savedUsername) {
      loginForm.style.display = 'none';
      logoutSection.style.display = 'block';
      usernameDisplay.textContent = savedUsername;
      loginTitle.textContent = '个人中心';
      loginTip.textContent = '已登录账号';
    } else {
      loginForm.style.display = '';
      logoutSection.style.display = 'none';
      loginTitle.textContent = '账号登录 / 注册';
      loginTip.textContent = '登录后可同步学习进度';
    }
  }

  function showLoginModal() {
    checkLoginState();
    loginModal.style.display = 'flex';
    usernameInput.value = '';
    passwordInput.value = '';
    setTimeout(function() { usernameInput.focus(); }, 100);
  }

  function hideLoginModal() {
    loginModal.style.display = 'none';
  }

  window.showLoginModal = showLoginModal;

  function handleLoginSubmit(isRegister) {
    var username = usernameInput.value.trim();
    var password = passwordInput.value.trim();
    if (!username || !password) {
      showToast('请输入邮箱和密码');
      return;
    }
    if (isRegister) {
      var existingPwd = localStorage.getItem('st_pwd_' + username);
      if (existingPwd) {
        showToast('该邮箱已注册，请直接登录');
        return;
      }
      var regBtn = document.getElementById('btn-register-submit');
      regBtn.textContent = '注册中...';
      regBtn.style.background = '#b45309';
      localStorage.setItem('st_pwd_' + username, simpleHash(password));
      localStorage.setItem('st_logged_in', 'true');
      localStorage.setItem('st_username', username);
      if (typeof PointsSystem !== 'undefined') {
        PointsSystem.init(username);
        PointsSystem.earn('REGISTER', '注册奖励');
      }
      checkLoginState();
      regBtn.textContent = '注册成功 ✓';
      regBtn.style.background = '#16a34a';
      setTimeout(function(){ regBtn.textContent = '注册'; regBtn.style.background = ''; }, 2000);
      showToast('注册成功，已自动登录');
      setTimeout(function() {
        hideLoginModal();
        if (window.__pendingStartGame) navigateTo('script-select.html');
      }, 800);
    } else {
      var storedPwd = localStorage.getItem('st_pwd_' + username);
      if (!storedPwd) {
        showToast('账号不存在，请先注册');
        return;
      }
      if (storedPwd !== simpleHash(password)) {
        showToast('密码错误');
        return;
      }
      localStorage.setItem('st_logged_in', 'true');
      localStorage.setItem('st_username', username);
      if (typeof PointsSystem !== 'undefined') {
        PointsSystem.init(username);
      }
      checkLoginState();
      showToast('登录成功');
      setTimeout(function() {
        hideLoginModal();
        if (window.__pendingStartGame) navigateTo('script-select.html');
      }, 800);
    }
  }

  function handleSkipLogin() {
    localStorage.setItem('st_guest_mode', 'true');
    localStorage.removeItem('st_logged_in');
    localStorage.removeItem('st_username');
    hideLoginModal();
    showToast('已使用游客模式进入');
    navigateTo('script-select.html');
  }

  function handleLogout() {
    localStorage.removeItem('st_logged_in');
    localStorage.removeItem('st_username');
    checkLoginState();
    showToast('已退出登录');
  }

  var btnProfile = document.getElementById('btn-profile');
  if (btnProfile) btnProfile.addEventListener('click', showLoginModal);

  document.getElementById('login-modal-close').addEventListener('click', hideLoginModal);
  backdrop.addEventListener('click', hideLoginModal);
  document.getElementById('btn-login-submit').addEventListener('click', function() { handleLoginSubmit(false); });
  document.getElementById('btn-register-submit').addEventListener('click', function() { handleLoginSubmit(true); });
  document.getElementById('btn-skip-login').addEventListener('click', handleSkipLogin);
  document.getElementById('btn-logout').addEventListener('click', handleLogout);
  passwordInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') handleLoginSubmit(false); });

  // ESC 关闭
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && loginModal.style.display !== 'none') hideLoginModal();
  });
})();
</script>

</body></html>
