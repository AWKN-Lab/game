<script>
const params = new URLSearchParams(location.search);
const scriptId = params.get('id') || params.get('script') || 'french_revolution';
const scriptInfo = SCRIPT_REGISTRY[scriptId] || SCRIPT_REGISTRY['french_revolution'];

// 立即更新页面标题（不等 DOMContentLoaded）
document.title = 'The Celestial Scholar - ' + scriptInfo.name;
const h1El = document.querySelector('h1');
if (h1El) h1El.textContent = scriptInfo.name;
const heroImageEl = document.getElementById('script-hero-image');
if (heroImageEl && scriptInfo.bgImage) {
  heroImageEl.src = scriptInfo.bgImage;
  heroImageEl.alt = scriptInfo.name + '剧本封面';
}

document.addEventListener('DOMContentLoaded', function() {
  // 返回按钮
  var backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.addEventListener('click', function() { navigateTo('script-select.html'); });

  // "开始游戏" -> 有存档直接进游戏，无存档走 loading
  document.querySelectorAll('.sigil-button').forEach(btn => {
    if (btn.textContent.includes('开始游戏')) {
      btn.addEventListener('click', function() {
        var saved = window.DataStore ? DataStore.loadProgress(scriptId) : null;
        if (saved && saved.dialogIndex > 0) {
          var gameFile = SCRIPT_REGISTRY[scriptId] ? SCRIPT_REGISTRY[scriptId].file : 'game-scene.html';
          navigateTo(gameFile + '?id=' + scriptId);
        } else {
          navigateTo('loading.html?id=' + scriptId);
        }
      });
    }
  });

  // Mobile start button handler
  var mobileStartBtn = document.getElementById('mobile-start-btn');
  if (mobileStartBtn) {
    mobileStartBtn.addEventListener('click', function() {
      var saved = window.DataStore ? DataStore.loadProgress(scriptId) : null;
      if (saved && saved.dialogIndex > 0) {
        var gameFile = SCRIPT_REGISTRY[scriptId] ? SCRIPT_REGISTRY[scriptId].file : 'game-scene.html';
        navigateTo(gameFile + '?id=' + scriptId);
      } else {
        navigateTo('loading.html?id=' + scriptId);
      }
    });
  }

  // Nav "Archive" -> script-select.html
  document.querySelectorAll('nav span, nav a').forEach(el => {
    if (el.textContent.trim() === 'Archive') {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => navigateTo('script-select.html'));
    }
    if (el.textContent.trim() === 'World Map') {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => navigateTo('index.html'));
    }
    if (el.textContent.trim() === 'Social') {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => showToast('社交功能即将上线'));
    }
    if (el.textContent.trim() === 'Log') {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => navigateTo('my-learning.html'));
    }
  });

  // Sidebar buttons (desktop)
  document.querySelectorAll('aside div[class*="cursor-pointer"], aside div[class*="group"]').forEach(el => {
    el.addEventListener('click', function() {
      const text = this.textContent;
      if (text.includes('World Map')) navigateTo('index.html');
      else if (text.includes('Archive')) navigateTo('script-select.html');
      else if (text.includes('Social')) showToast('社交功能即将上线');
      else if (text.includes('Log')) navigateTo('my-learning.html');
    });
  });

  // Tab switching
  const tabContainer = document.querySelector('.flex.items-center.space-x-1');
  if (tabContainer) {
    const tabs = tabContainer.querySelectorAll('button');
    const contents = document.querySelectorAll('.tab-content');
    tabs.forEach((tab, i) => {
      tab.addEventListener('click', function() {
        tabs.forEach(t => {
          t.classList.remove('bg-surface-container', 'text-primary', 'shadow-lg');
          t.classList.add('text-on-surface-variant');
        });
        this.classList.add('bg-surface-container', 'text-primary', 'shadow-lg');
        this.classList.remove('text-on-surface-variant');
        contents.forEach(c => c.style.display = 'none');
        if (contents[i]) contents[i].style.display = '';
      });
    });
  }

  renderLearningAchievement();
});

function navigateTo(url) {
  document.body.style.opacity = '0';
  document.body.style.transition = 'opacity 0.3s ease';
  setTimeout(() => { window.location.href = url; }, 300);
}
function showToast(msg) {
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(40,51,86,0.95);color:#dbe1ff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:10001;backdrop-filter:blur(10px);border:1px solid rgba(239,189,138,0.3);';
  document.body.appendChild(t);
  setTimeout(function() { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function() { t.remove(); }, 300); }, 2000);
}
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var params = new URLSearchParams(window.location.search);
  var scriptId = params.get('id') || params.get('script') || 'french_revolution';
  var CATEGORY_LABELS = { history: '历史', daofa: '道法' };
  var CATEGORY_COLORS = { history: 'bg-blue-900/50 text-blue-300', daofa: 'bg-green-900/50 text-green-300' };
  var graph = null;
  var resetBtn = document.getElementById('knowledge-graph-reset');

  if (resetBtn) {
    resetBtn.addEventListener('click', function() {
      if (graph && typeof graph.resetView === 'function') {
        graph.resetView();
      }
    });
  }

  var kpFetchTimeout = new Promise(function(_, reject) { setTimeout(function() { reject(new Error('timeout')); }, 5000); });
  Promise.race([fetch((window.__basePath || '/') + 'data/knowledge_points.json'), kpFetchTimeout])
    .then(function(r) { return r.json(); })
    .then(async function(data) {
      var currentData = data[scriptId] || data['french_revolution'];
      if (!currentData) return;

      var allPoints = [];
      for (var cat in currentData) {
        if (!Array.isArray(currentData[cat])) continue;
        currentData[cat].forEach(function(kp) {
          kp._category = cat;
          allPoints.push(kp);
        });
      }

      // 更新知识点数量
      var countEl = document.querySelector('[data-field="kp-count"]');
      if (countEl) countEl.textContent = allPoints.length + '个';

      // 更新难度星级
      var count = allPoints.length;
      var difficulty = count <= 8 ? 2 : count <= 14 ? 3 : count <= 20 ? 4 : 5;
      var starsHtml = '';
      for (var i = 0; i < 5; i++) {
        var filled = i < difficulty;
        starsHtml += '<span class="material-symbols-outlined text-sm" style="font-variation-settings: \'FILL\' ' + (filled ? 1 : 0) + ';">star</span>';
      }
      var starsEl = document.getElementById('difficulty-stars');
      if (starsEl) starsEl.innerHTML = starsHtml;

      var KnowledgeGraphGalaxy = await Promise.resolve(window.__knowledgeGraphGalaxyReady);
      if (!KnowledgeGraphGalaxy) {
        console.error('KnowledgeGraphGalaxy 未就绪');
        return;
      }

      // 初始化当前剧本专属知识星系
      graph = new KnowledgeGraphGalaxy('knowledge-graph-container', {
        starfieldCountMultiplier: 1.45,
        starfieldOpacityMultiplier: 1.45,
        starfieldSizeMultiplier: 1.16,
        backdropOpacityMultiplier: 1.38,
        onNodeClick: function(node) {
          var panel = document.getElementById('kp-detail-panel');
          document.getElementById('kp-detail-title').textContent = node.name;
          document.getElementById('kp-detail-content').textContent = node.content;
          var tagEl = document.getElementById('kp-detail-tag');
          tagEl.textContent = CATEGORY_LABELS[node.subject] || node.subject;
          tagEl.className = 'px-2 py-0.5 rounded text-xs font-label ' + (CATEGORY_COLORS[node.subject] || '');
          document.getElementById('kp-detail-act').textContent = '第' + node.act + '幕';
          panel.style.display = 'block';
        }
      });
      graph.loadData(currentData);
      window.scriptDetailKnowledgeGraph = graph;
    })
    .catch(function(err) {
      console.error('知识点数据加载失败:', err);
      var countEl = document.querySelector('[data-field="kp-count"]');
      if (countEl) countEl.textContent = '加载失败，请刷新';
      var starsEl = document.getElementById('difficulty-stars');
      if (starsEl) starsEl.innerHTML = '<span class="text-on-surface-variant text-xs">加载失败</span>';
    });
});

window.addEventListener('beforeunload', function() {
  if (window.scriptDetailKnowledgeGraph && typeof window.scriptDetailKnowledgeGraph.destroy === 'function') {
    window.scriptDetailKnowledgeGraph.destroy();
    window.scriptDetailKnowledgeGraph = null;
  }
});

function renderLearningAchievement() {
  var container = document.getElementById('learning-achievement-content');
  if (!container) return;

  var tierColors = { master: '#ffd700', excellent: '#a78bfa', completed: '#60a5fa' };
  var tierLabels = { master: '学霸成就', excellent: '学习标兵', completed: '剧情通关' };
  var tierIcons = { master: '👑', excellent: '📖', completed: '📜' };
  var best = window.DataStore ? DataStore.getBestScriptAssessment(scriptId) : null;

  if (!best) {
    container.innerHTML = '<div class="text-on-surface-variant text-xs text-center py-1">' +
      '<span style="font-size:18px;">📝</span> 尚未进行学习评级 — 完成剧本后即可挑战' +
    '</div>';
    return;
  }

  var tier = best.bestTier || 'completed';
  container.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px;">' +
      '<div style="font-size:28px;">' + (tierIcons[tier] || '📜') + '</div>' +
      '<div style="flex:1;">' +
        '<div style="font-size:14px;font-weight:bold;color:' + (tierColors[tier] || '#60a5fa') + ';">' + (tierLabels[tier] || '剧情通关') + '</div>' +
        '<div style="font-size:11px;color:#8f909d;">综合 <span style="color:#dbe1ff;font-weight:bold;">' + (best.bestLearningPct || 0) + '%</span> · 论述 ' + (best.essayCorrectSlots || 0) + '/' + (best.essayTotalSlots || 0) + ' · 选择 ' + (best.quizPct || 0) + '%</div>' +
      '</div>' +
      '<button onclick="rechallengeLearning()" style="background:linear-gradient(135deg,#efbd8a,#5a3912);color:#472a03;border:none;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer;white-space:nowrap;">重新挑战</button>' +
    '</div>';
}

function rechallengeLearning() {
  var gameFile = SCRIPT_REGISTRY[scriptId] ? SCRIPT_REGISTRY[scriptId].file : 'game-scene.html';
  navigateTo(gameFile + '?id=' + scriptId + '&rechallenge=1');
}
</script>
