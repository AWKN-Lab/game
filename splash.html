<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>时空剧场 - 启动</title>
    <link rel="stylesheet" href="dist/output.css?v=5"/>
<script src="audio-manager.js?v=20260525c"></script>
<script src="data-store.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Manrope:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes progressFill {
            from { width: 0%; }
            to { width: 100%; }
        }
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 20px rgba(239, 189, 138, 0.3), 0 0 40px rgba(239, 189, 138, 0.1); }
            50% { text-shadow: 0 0 30px rgba(239, 189, 138, 0.5), 0 0 60px rgba(239, 189, 138, 0.2); }
        }
        body {
            font-family: 'Manrope', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .splash-container {
            animation: fadeIn 0.8s ease-out;
        }
        .logo-text {
            font-family: 'Noto Serif SC', serif;
            animation: glowPulse 3s ease-in-out infinite;
        }
        .progress-bar-fill {
            animation: progressFill 3s ease-in-out forwards;
            background: linear-gradient(90deg, #efbd8a, #ffdcbc, #efbd8a);
            background-size: 200% 100%;
            animation: progressFill 3s ease-in-out forwards, shimmer 2s linear infinite;
        }
        .progress-track {
            background: rgba(40, 51, 86, 0.6);
            border: 1px solid rgba(239, 189, 138, 0.15);
        }
        button:active { transform: scale(0.9); }
</style>
</head>
<body class="bg-[#0a0e27] min-h-screen flex items-center justify-center">
<div class="splash-container flex flex-col items-center justify-center min-h-screen w-full px-6">
        <!-- Decorative top line -->
        <div class="flex items-center gap-4 mb-12">
            <div class="h-px w-12 bg-gradient-to-r from-transparent to-[#efbd8a]/40"></div>
            <div class="w-2 h-2 rounded-full bg-[#efbd8a]/30"></div>
            <div class="h-px w-12 bg-gradient-to-l from-transparent to-[#efbd8a]/40"></div>
        </div>

        <!-- Logo -->
        <h1 class="logo-text text-5xl md:text-6xl text-[#efbd8a] mb-6 tracking-wider">
            时空剧场
        </h1>

        <!-- Subtitle -->
        <p class="text-lg text-[#8f909d] mb-3 tracking-widest font-light">
            道法历史同步学习
        </p>

        <!-- Endorsement -->
        <p class="text-xs text-[#6b7280] mb-16 tracking-wide">
            广东省数科研究院决策实验室推荐
        </p>

        <!-- Spacer -->
        <div class="flex-1"></div>

        <!-- Loading Progress Bar -->
        <div class="w-full max-w-xs mb-12">
            <div class="progress-track h-1 rounded-full overflow-hidden">
                <div class="progress-bar-fill h-full rounded-full"></div>
            </div>
            <p class="text-center text-[10px] text-[#6b7280] mt-3 tracking-widest uppercase" style="font-family: 'Plus Jakarta Sans', sans-serif;">
                Loading
            </p>
        </div>
    </div>
    <script>
      localStorage.setItem('st_splash_seen', 'true');
      setTimeout(function() {
        window.location.replace('index.html?skip=1');
      }, 1200);
    </script>

</body>
</html>
