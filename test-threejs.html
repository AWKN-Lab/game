<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js测试</title>
<script src="https://unpkg.com/three@0.128.0/build/three.module.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js"></script>
<style>
body {
  margin: 0;
  padding: 0;
  background-color: #0a0e27;
  color: white;
  font-family: Arial, sans-serif;
}
#container {
  width: 100vw;
  height: 100vh;
  position: relative;
}
.info {
  position: absolute;
  top: 20px;
  left: 20px;
  background: rgba(0,0,0,0.7);
  padding: 10px;
  border-radius: 5px;
  z-index: 10;
}
</style>
</head>
<body>
<div id="container"></div>
<div class="info">
  <h3>Three.js测试</h3>
  <p>如果能看到一个旋转的立方体，则Three.js正常工作</p>
  <div id="status"></div>
</div>

<script type="module">
  try {
    import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';

    document.getElementById('status').innerHTML = '<p style="color: green;">Three.js 模块加载成功!</p>';

    // 创建场景
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e27);

    // 创建相机
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    // 创建渲染器
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('container').appendChild(renderer.domElement);

    // 创建立方体
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);

    // 添加轨道控制
    const controls = new OrbitControls(camera, renderer.domElement);

    // 动画循环
    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.x += 0.01;
      cube.rotation.y += 0.01;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    console.log('Three.js 测试成功');
  } catch (error) {
    console.error('Three.js 加载失败:', error);
    document.getElementById('status').innerHTML = '<p style="color: red;">Three.js 加载失败: ' + error.message + '</p>';
  }
</script>
</body>
</html>
