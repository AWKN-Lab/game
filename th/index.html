<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="胡桃来电 - 中考加油！">
<meta property="og:description" content="胡桃为臧志轩、陈一诺同学送上中考祝福！">
<meta property="og:image" content="https://awkn.cn/game/th/avatar.png">
<meta property="og:url" content="https://awkn.cn/game/th">
<meta property="og:type" content="website">
<title>来电 - 胡桃</title>
<style>
* { margin:0;padding:0;box-sizing:border-box; }
html,body { width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0a1a;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

#call-screen { position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#2a0a0a 0%,#3a1a1a 40%,#1d0d0d 100%);z-index:10;transition:opacity .6s,transform .6s; }
#call-screen.hidden { opacity:0;transform:scale(.95);pointer-events:none; }

.avatar-ring { position:relative;width:140px;height:140px;margin-bottom:40px; }
.avatar-ring::before { content:'';position:absolute;inset:-12px;border-radius:50%;border:3px solid rgba(255,120,100,.3);animation:ring-pulse 2s ease-in-out infinite; }
.avatar-ring::after { content:'';position:absolute;inset:-28px;border-radius:50%;border:2px solid rgba(255,120,100,.15);animation:ring-pulse 2s ease-in-out .5s infinite; }
@keyframes ring-pulse { 0%,100%{transform:scale(1);opacity:.8} 50%{transform:scale(1.08);opacity:.3} }
.avatar { width:140px;height:140px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.15);animation:avatar-float 3s ease-in-out infinite;box-shadow:0 0 40px rgba(255,120,100,.2); }
@keyframes avatar-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.caller-name { color:#fff;font-size:28px;font-weight:600;letter-spacing:2px;margin-bottom:10px; }
.call-status { color:rgba(255,255,255,.6);font-size:15px;display:flex;align-items:center;gap:6px;margin-bottom:60px; }
.call-status .dot { width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);animation:dot-blink 1.4s ease-in-out infinite; }
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes dot-blink { 0%,100%{opacity:.3} 50%{opacity:1} }

.btn-row { display:flex;gap:50px; }
.btn { width:70px;height:70px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent; }
.btn:active { transform:scale(.9); }
.btn-decline { background:rgba(255,60,60,.9);box-shadow:0 6px 24px rgba(255,40,40,.4); }
.btn-answer { background:rgba(50,210,100,.9);box-shadow:0 6px 24px rgba(40,200,80,.4);animation:answer-glow 2s ease-in-out infinite; }
@keyframes answer-glow { 0%,100%{box-shadow:0 6px 24px rgba(40,200,80,.4)} 50%{box-shadow:0 6px 40px rgba(40,200,80,.7)} }
.btn svg { width:32px;height:32px;fill:#fff; }
.btn-label { color:rgba(255,255,255,.7);font-size:12px;margin-top:8px;text-align:center; }

#video-screen { position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center; }
#video-screen.active { display:flex; }
#video-screen video { width:100%;height:100%;object-fit:contain; }

.hangup-bar { position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:30;opacity:0;transition:opacity .3s; }
.hangup-bar.show { opacity:1; }
.btn-hangup { width:60px;height:60px;border-radius:50%;background:rgba(255,50,50,.9);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(255,40,40,.4);transition:transform .2s; }
.btn-hangup:active { transform:scale(.9); }
.btn-hangup svg { width:28px;height:28px;fill:#fff;transform:rotate(135deg); }

#end-overlay { position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column; }
#end-overlay.active { display:flex; }
.end-text { color:#fff;font-size:22px;font-weight:500;margin-bottom:24px; }
.end-duration { color:rgba(255,255,255,.5);font-size:14px;margin-bottom:40px; }
.btn-close { padding:12px 36px;border-radius:24px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:16px;cursor:pointer; }
.fade-in { animation:fadeIn .5s ease-out; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
</style>
</head>
<body>

<div id="call-screen">
    <div class="avatar-ring"><img class="avatar" src="avatar.png" alt="胡桃"></div>
    <div class="caller-name">胡桃</div>
    <div class="call-status">来电中<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="btn-row">
        <div style="display:flex;flex-direction:column;align-items:center;">
            <button class="btn btn-decline" id="btn-decline" aria-label="拒绝"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.36 11.36 0 003.58.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.36 11.36 0 00.57 3.58 1 1 0 01-.25 1.01l-2.2 2.2z"/></svg></button>
            <div class="btn-label">拒绝</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;">
            <button class="btn btn-answer" id="btn-answer" aria-label="接听"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.36 11.36 0 003.58.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.36 11.36 0 00.57 3.58 1 1 0 01-.25 1.01l-2.2 2.2z"/></svg></button>
            <div class="btn-label">接听</div>
        </div>
    </div>
</div>

<div id="video-screen">
    <video id="main-video" playsinline webkit-playsinline x5-video-player-type="h5" x5-video-orientation="portrait">
        <source src="hutao_calling_vertical.mp4?v=11" type="video/mp4">
    </video>
    <div class="hangup-bar" id="hangup-bar">
        <button class="btn-hangup" id="btn-hangup" aria-label="挂断"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.36 11.36 0 003.58.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.36 11.36 0 00.57 3.58 1 1 0 01-.25 1.01l-2.2 2.2z"/></svg></button>
    </div>
</div>

<div id="end-overlay">
    <div class="end-text">通话结束</div>
    <div class="end-duration" id="end-duration"></div>
    <button class="btn-close" id="btn-close">返回主页</button>
</div>

<audio id="ringtone" src="ringtone_climax.wav" loop preload="auto"></audio>

<script>
(function() {
    var callScreen = document.getElementById('call-screen');
    var videoScreen = document.getElementById('video-screen');
    var mainVideo = document.getElementById('main-video');
    var hangupBar = document.getElementById('hangup-bar');
    var endOverlay = document.getElementById('end-overlay');
    var endDuration = document.getElementById('end-duration');
    var ringtone = document.getElementById('ringtone');
    var callStartTime = 0, hangupTimer = null, answered = false, redirected = false;

    function stopRingtone(){ ringtone.pause();ringtone.currentTime=0; }
    function startRingtone(){ if(!answered) ringtone.play().catch(function(){}); }
    function forceStartRingtone(){ if(answered||!ringtone.paused)return; ringtone.play().catch(function(){try{var rt=new Audio('ringtone_climax.wav');rt.loop=true;rt.play().catch(function(){});}catch(e){}}); }

    window.scrollTo(0,1);
    startRingtone();
    document.addEventListener('click',function(){if(!answered&&ringtone.paused)forceStartRingtone();},{passive:true});
    document.addEventListener('touchstart',function(){if(!answered&&ringtone.paused)forceStartRingtone();},{passive:true});

    document.getElementById('btn-answer').addEventListener('click',function(e){
        e.stopPropagation();
        answered=true;stopRingtone();
        callScreen.classList.add('hidden');
        setTimeout(function(){
            callScreen.style.display='none';
            videoScreen.classList.add('active','fade-in');
            window.scrollTo(0,1); callStartTime=Date.now();
            mainVideo.muted=false;
            mainVideo.play().then(function(){window.scrollTo(0,1);}).catch(function(){
                mainVideo.muted=true; mainVideo.play().then(function(){setTimeout(function(){mainVideo.muted=false;window.scrollTo(0,1);},300);});
            });
            setTimeout(function(){hangupBar.classList.add('show');},1500);
        },400);
    });

    document.getElementById('btn-decline').addEventListener('click',function(e){
        e.stopPropagation();
        answered=true;stopRingtone();
        callScreen.classList.add('hidden');
        setTimeout(function(){showEndScreen();},400);
    });

    document.getElementById('btn-hangup').addEventListener('click',function(){mainVideo.pause();showEndScreen();});
    document.getElementById('btn-close').addEventListener('click',function(){location.href='http://awkn.cn/game/';});

    mainVideo.addEventListener('ended',function(){
        showEndScreen();
        if(!redirected){redirected=true;setTimeout(function(){location.href='http://awkn.cn/game/';},2500);}
    });

    function showEndScreen(){
        videoScreen.classList.remove('active');hangupBar.classList.remove('show');
        if(callStartTime>0){
            var sec=Math.round((Date.now()-callStartTime)/1000);
            endDuration.textContent='通话时长 '+Math.floor(sec/60)+':'+(sec%60<10?'0':'')+(sec%60);
        }
        endOverlay.classList.add('active','fade-in');
    }

    mainVideo.addEventListener('click',function(){
        if(hangupBar.classList.contains('show')){hangupBar.classList.remove('show');clearTimeout(hangupTimer);hangupTimer=setTimeout(function(){hangupBar.classList.add('show');},3000);}
        else{hangupBar.classList.add('show');clearTimeout(hangupTimer);hangupTimer=setTimeout(function(){hangupBar.classList.remove('show');},3000);}
    });

    document.addEventListener('touchstart',function(){},{passive:true});
})();
</script>
</body>
</html>
